[client]
# 우측 상단 Deploy 버튼 등 개발자 메뉴 숨김
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[theme]
baseRadius = "0.75rem"
buttonRadius = "0.75rem"
baseFontSize = 17
headingFontWeights = [800, 700]

# 강조색 1개(따뜻한 주황) + 중립색. 흰 글씨가 올라가는 primary 버튼 대비 4.5:1 이상
# (라이트·다크 모두 #C2410C: 흰 글씨 5.18:1, 다크 배경 위 테두리·진행 바 3.38:1)
# ui_style.py의 --sl-accent도 같은 값으로 맞춰 둘 것
[theme.light]
primaryColor = "#C2410C"
backgroundColor = "#FFFCF7"
secondaryBackgroundColor = "#F6EFE5"
textColor = "#2A2522"
borderColor = "#E6DACB"

[theme.dark]
primaryColor = "#C2410C"
backgroundColor = "#1C1917"
secondaryBackgroundColor = "#2A2522"
textColor = "#F5EFE8"
borderColor = "#443D37"
